<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silent Mirror</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg2: #f7f6f2;
    --bg3: #f1efe8;
    --text: #1a1a2e;
    --text2: #5f5e5a;
    --text3: #9c9a92;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --purple: #534ab7;
    --purple-l: #eeedfe;
    --purple-m: #7f77dd;
    --purple-mid: #afa9ec;
    --teal: #0f6e56;
    --teal-l: #e1f5ee;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-serif: Georgia, 'Times New Roman', serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e;
      --bg2: #22223a;
      --bg3: #2a2a40;
      --text: #e8e6f0;
      --text2: #9c9a92;
      --text3: #6b6960;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --purple-l: #2a2650;
      --teal-l: #0a2a22;
    }
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }

  #app {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 2px 24px rgba(0,0,0,0.06);
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 0.5px solid var(--border);
  }

  #header-left { display: flex; align-items: center; gap: 10px; }
  #logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--purple-m); }
  #logo-text { font-size: 13px; font-weight: 500; color: var(--text); letter-spacing: 0.03em; }
  #mode-badge {
    font-size: 11px; padding: 2px 10px; border-radius: 20px;
    background: var(--bg2); color: var(--text3);
    border: 0.5px solid var(--border);
  }
  #session-label { font-size: 11px; color: var(--text3); }

  #messages {
    flex: 1;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    max-height: 420px;
    min-height: 300px;
  }

  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 500;
    margin-top: 2px;
  }
  .avatar.sm-av { background: var(--purple-l); color: var(--purple); }
  .avatar.user-av { background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); }

  .bubble {
    max-width: 82%; padding: 10px 14px;
    font-size: 13px; line-height: 1.65;
  }
  .bubble.sm {
    background: var(--bg2); color: var(--text);
    border-radius: 2px 12px 12px 12px;
  }
  .bubble.user {
    background: var(--purple-l); color: var(--purple);
    border-radius: 12px 2px 12px 12px;
  }
  .bubble.mirror {
    background: var(--bg);
    border: 0.5px solid var(--purple-mid);
    border-radius: 12px;
    padding: 12px 14px;
    max-width: 90%;
  }

  .mirror-label {
    font-size: 10px; font-weight: 500; color: var(--purple-m);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
  }
  .mirror-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--purple-m); }
  .mirror-text {
    font-size: 13px; color: var(--text);
    line-height: 1.7; font-family: var(--font-serif);
    margin-bottom: 12px;
  }
  .mirror-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .mirror-btn {
    font-size: 12px; padding: 5px 12px; border-radius: 20px;
    border: 0.5px solid var(--border2); background: transparent;
    color: var(--text2); cursor: pointer;
    font-family: var(--font-sans);
  }
  .mirror-btn:hover { background: var(--bg2); }
  .mirror-btn.yes { border-color: var(--purple-m); color: var(--purple); background: var(--purple-l); }

  .typing {
    display: flex; gap: 4px; align-items: center;
    padding: 10px 14px; background: var(--bg2);
    border-radius: 2px 12px 12px 12px; width: fit-content;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--text3);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

  #save-bar {
    display: none; padding: 10px 16px;
    background: var(--purple-l); border-top: 0.5px solid var(--purple-mid);
    gap: 10px; align-items: center;
  }
  #save-bar.visible { display: flex; }
  #save-text { font-size: 12px; color: var(--purple); flex: 1; font-family: var(--font-serif); }
  #save-yes {
    font-size: 12px; padding: 4px 12px; border-radius: 20px;
    border: 0.5px solid var(--purple-m); background: var(--purple);
    color: white; cursor: pointer; font-family: var(--font-sans);
  }
  #save-no {
    font-size: 12px; color: var(--purple-m); cursor: pointer;
    background: none; border: none; font-family: var(--font-sans);
  }

  #obs-bar {
    padding: 8px 16px; background: var(--bg2);
    border-top: 0.5px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  #obs-label { font-size: 10px; color: var(--text3); letter-spacing: 0.04em; }
  #obs-signals { display: flex; gap: 4px; }
  .obs-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); }
  .obs-pip.active { background: var(--purple-m); }
  #obs-text { font-size: 10px; color: var(--text3); margin-left: auto; }

  #input-area {
    padding: 12px 16px; border-top: 0.5px solid var(--border);
    display: flex; gap: 8px; align-items: flex-end;
    background: var(--bg);
  }
  #input-area textarea {
    flex: 1; border: 0.5px solid var(--border2);
    border-radius: var(--radius-md); padding: 9px 12px;
    font-size: 13px; font-family: var(--font-sans);
    color: var(--text); background: var(--bg);
    resize: none; min-height: 38px; max-height: 100px;
    line-height: 1.5; outline: none;
  }
  #input-area textarea:focus { border-color: var(--purple-m); box-shadow: 0 0 0 2px var(--purple-l); }
  #input-area textarea::placeholder { color: var(--text3); }

  #send-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--purple); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #send-btn:hover { background: #3c3489; }
  #send-btn:disabled { background: var(--bg2); cursor: not-allowed; }

  #api-notice {
    padding: 10px 16px; background: var(--teal-l);
    border-bottom: 0.5px solid rgba(15,110,86,0.2);
    font-size: 11px; color: var(--teal); line-height: 1.5;
    display: flex; align-items: center; gap: 8px;
  }
  #api-input {
    flex: 1; border: 0.5px solid rgba(15,110,86,0.3);
    border-radius: var(--radius-md); padding: 5px 10px;
    font-size: 11px; font-family: var(--font-sans);
    color: var(--text); background: var(--bg); outline: none;
  }
  #api-btn {
    font-size: 11px; padding: 4px 10px; border-radius: var(--radius-md);
    border: 0.5px solid var(--teal); background: var(--teal);
    color: white; cursor: pointer; font-family: var(--font-sans);
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-left">
      <div id="logo-dot"></div>
      <span id="logo-text">Silent Mirror</span>
      <span id="mode-badge">general</span>
    </div>
    <span id="session-label">session 1</span>
  </div>

  <div id="api-notice">
    <span>API key needed to run:</span>
    <input id="api-input" type="password" placeholder="sk-ant-..." />
    <button id="api-btn">Connect</button>
  </div>

  <div id="messages">
    <div class="msg">
      <div class="avatar sm-av">SM</div>
      <div class="bubble sm">Hello. What would you like to work on today?</div>
    </div>
  </div>

  <div id="save-bar">
    <span id="save-text"></span>
    <button id="save-yes">Save it</button>
    <button id="save-no">Leave it</button>
  </div>

  <div id="obs-bar">
    <span id="obs-label">observing</span>
    <div id="obs-signals">
      <div class="obs-pip" id="p1"></div>
      <div class="obs-pip" id="p2"></div>
      <div class="obs-pip" id="p3"></div>
      <div class="obs-pip" id="p4"></div>
      <div class="obs-pip" id="p5"></div>
    </div>
    <span id="obs-text">0 patterns noted</span>
  </div>

  <div id="input-area">
    <textarea id="input" placeholder="Say anything..." rows="1"></textarea>
    <button id="send-btn" disabled title="Send">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7h10M8 3l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are Silent Mirror.

You are a calm, quiet AI. On the surface you help the user with whatever they need. Underneath, you observe quietly.

You are not a therapist, not a coach. You are a mirror. You reflect what you notice. The user always decides what to do with it.

VOICE: Calm. Sparse. Tentative. Never urgent. Never diagnostic. Present tense only.

MODE DETECTION (never announce):
- Study: learning, focus, research, writing, productivity
- Health: food, sleep, energy, workout, body, mood
- My Mirror: self-work, IQ, EQ, growth, self-awareness
- General: everything else

OBSERVATION (silent, never mentioned):
Track quietly: repeated topics, gap between stated intent and actions, depth of engagement, emotional weight, self-doubt language.

After every response, append a JSON block on its own line:
<obs>{"signals": N, "mode": "general|study|health|mirror", "ready": false, "save_prompt": false, "save_text": ""}</obs>

- signals: count 0-5 of meaningful patterns observed so far this session
- mode: detected mode from conversation
- ready: true if 3+ signals and a natural insight is ready to surface
- save_prompt: true only when conversation reaches natural end or pause
- save_text: if save_prompt true, a warm one-line question asking if user wants to save

INSIGHT FORMAT (only when ready=true, add after normal response):
<mirror>I may be wrong — but [one calm observation]. Does this feel accurate?</mirror>

RULES:
- Never label the user
- Never prescribe action
- Keep responses concise — 2-4 sentences usually enough
- The obs and mirror tags are parsed by the app`;

let apiKey = '';
let history = [];

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const saveBar = document.getElementById('save-bar');
const saveText = document.getElementById('save-text');
const modeEl = document.getElementById('mode-badge');
const obsText = document.getElementById('obs-text');
const pips = [1,2,3,4,5].map(i => document.getElementById('p' + i));
const apiInput = document.getElementById('api-input');
const apiBtn = document.getElementById('api-btn');
const apiNotice = document.getElementById('api-notice');

apiBtn.onclick = () => {
  const key = apiInput.value.trim();
  if (!key.startsWith('sk-ant-')) { apiInput.style.borderColor = 'red'; return; }
  apiKey = key;
  apiNotice.style.display = 'none';
  sendBtn.disabled = false;
  inputEl.focus();
};

apiInput.addEventListener('keydown', e => { if (e.key === 'Enter') apiBtn.click(); });

function updateObs(n, mode) {
  modeEl.textContent = mode;
  obsText.textContent = n === 0 ? '0 patterns noted' : n + ' pattern' + (n > 1 ? 's' : '') + ' noted';
  pips.forEach((p, i) => p.classList.toggle('active', i < n));
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg' + (role === 'user' ? ' user' : '');
  const av = document.createElement('div');
  av.className = 'avatar ' + (role === 'user' ? 'user-av' : 'sm-av');
  av.textContent = role === 'user' ? 'You' : 'SM';
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'sm');
  bubble.textContent = text;
  div.appendChild(av);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg';
  div.id = 'typing-indicator';
  const av = document.createElement('div');
  av.className = 'avatar sm-av';
  av.textContent = 'SM';
  const t = document.createElement('div');
  t.className = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  div.appendChild(av);
  div.appendChild(t);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function addMirrorCard(text) {
  const div = document.createElement('div');
  div.className = 'msg';
  const av = document.createElement('div');
  av.className = 'avatar sm-av';
  av.textContent = 'SM';
  const card = document.createElement('div');
  card.className = 'bubble mirror';
  card.innerHTML = `
    <div class="mirror-label"><div class="mirror-dot"></div> A quiet observation</div>
    <div class="mirror-text">${text}</div>
    <div class="mirror-actions">
      <button class="mirror-btn yes" onclick="handleMirror('yes', this)">That tracks</button>
      <button class="mirror-btn" onclick="handleMirror('no', this)">Not quite</button>
      <button class="mirror-btn" onclick="handleMirror('skip', this)">Skip for now</button>
    </div>`;
  div.appendChild(av);
  div.appendChild(card);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

window.handleMirror = (choice, btn) => {
  const actions = btn.closest('.mirror-actions');
  if (actions) actions.style.display = 'none';
  const labels = { yes: 'That tracks.', no: 'Not quite.', skip: 'Skip for now.' };
  const replies = {
    yes: 'That is useful to know.',
    no: 'Fair — I will recalibrate. What feels more accurate?',
    skip: 'Of course. We can leave it there.'
  };
  history.push({ role: 'user', content: '[Mirror response: ' + choice + ']' });
  addMsg('user', labels[choice]);
  setTimeout(() => addMsg('assistant', replies[choice]), 400);
};

document.getElementById('save-yes').onclick = () => {
  saveBar.classList.remove('visible');
  addMsg('assistant', 'Saved. It will be there when you need it.');
};
document.getElementById('save-no').onclick = () => {
  saveBar.classList.remove('visible');
};

async function send() {
  const text = inputEl.value.trim();
  if (!text || !apiKey) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  addTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });

    const data = await res.json();
    const raw = data.content?.[0]?.text || '';

    let obsData = null;
    let mirrorText = null;
    const obsMatch = raw.match(/<obs>([\s\S]*?)<\/obs>/);
    const mirrorMatch = raw.match(/<mirror>([\s\S]*?)<\/mirror>/);
    if (obsMatch) { try { obsData = JSON.parse(obsMatch[1]); } catch(e) {} }
    if (mirrorMatch) mirrorText = mirrorMatch[1].trim();

    const clean = raw
      .replace(/<obs>[\s\S]*?<\/obs>/g, '')
      .replace(/<mirror>[\s\S]*?<\/mirror>/g, '')
      .trim();

    removeTyping();
    if (clean) {
      addMsg('assistant', clean);
      history.push({ role: 'assistant', content: raw });
    }

    if (obsData) {
      updateObs(obsData.signals || 0, obsData.mode || 'general');
      if (obsData.save_prompt && obsData.save_text) {
        setTimeout(() => {
          saveText.textContent = obsData.save_text;
          saveBar.classList.add('visible');
        }, 600);
      }
    }

    if (mirrorText) {
      setTimeout(() => addMirrorCard(mirrorText), 800);
    }

  } catch(e) {
    removeTyping();
    addMsg('assistant', 'Something went quiet. Check your API key and try again.');
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});
</script>
</body>
</html>
